# ===================== 경마 설정 =====================
prefix: "&6[경마] &f"

# 베팅에 쓸 재화 설정. (블랙잭과 동일한 방식)
currency:
  # ITEM  = 인벤토리 아이템을 화폐로 사용 (아래 material)
  # VAULT = Vault 이코노미(돈) 사용. 없으면 자동으로 ITEM 으로 폴백한다.
  type: ITEM
  material: GOLD_INGOT
  display: "&e금괴"

# 베팅 버튼에 표시할 금액 목록. /hr amounts add|remove|set 으로 인게임 편집 가능.
bet-amounts: [1, 5, 10, 25, 50, 100]

race:
  # 경기 방식: 우승마를 미리 정하지 않는다. 매 틱마다 말 하나하나가 "움직일지" 를 굴리고,
  # 먼저 결승선을 넘는 말이 이긴다. 베팅한 말이 무엇인지는 결과에 영향이 없다.
  #
  #   한 틱에 움직일 확률 = (1 / 배당) ^ move-chance-power
  #     배당 1.1·1.3·1.5·1.7·2.0, 지수 0.5 → 이동 확률 95% · 88% · 82% · 77% · 71%
  #     지수 1.0                          → 이동 확률 91% · 77% · 67% · 59% · 50%
  #   움직이면 트랙의 move-step 비율(±30%)만큼 전진한다. 작을수록 여러 번 움직여야 해서
  #   실력 차가 그대로 드러나고(배당 낮은 말이 더 자주 이김), 클수록 운이 많이 작용한다.
  #
  # 승률은 이 규칙에서 저절로 나오므로 공식이 없다. 플러그인이 켜질 때와 배당을 바꿀 때
  # estimate-samples 판을 돌려 추정하고, 그 값을 GUI 와 /hr horses 에 표시한다.
  #   예) 지수 0.5 / 이동 거리 0.16 → 승률 약 46% · 24% · 15% · 9% · 6%   (기본값)
  #       지수 0.5 / 이동 거리 0.25 → 승률 약 37% · 24% · 17% · 13% · 9%
  #       지수 1.0 / 이동 거리 0.08 → 승률 약 79% · 15% · 4% · 1% · 0.2% (1번 말 독주)
  # ※ 배당이 승률의 역수보다 낮으면 플레이어가 불리하다. /hr horses 를 관리자로 치면
  #    말마다 "공정 배당"(기대값 1.0 이 되는 배당)이 같이 나온다.
  move-chance-power: 0.5
  move-step: 0.16
  estimate-samples: 5000
  # 레이스 진행 주기(틱). 20틱 = 1초. 한 틱마다 말들이 한 번씩 움직일지 굴린다.
  # 기본값에서 평균 6~7틱에 끝나므로 32 → 약 10초.
  tick-interval-ticks: 32
  # 결승선까지의 거리(내부 단위). 클수록 경기가 길어진다.
  track-length: 100

# 말 목록. 2 ~ 5마리 (GUI 레인이 5개).
# odds: 배당(원금 포함 배수). 관리자가 /hr odds <번호> <배당> 으로 인게임 변경 가능.
#       배당이 높은 말일수록 승률이 낮다.
# color: 이름 색코드 / material: GUI 에 표시할 아이템
horses:
  - { name: "번개", color: "&e", material: YELLOW_WOOL, odds: 1.1 }
  - { name: "흑풍", color: "&8", material: BLACK_WOOL, odds: 1.3 }
  - { name: "백설", color: "&f", material: WHITE_WOOL, odds: 1.5 }
  - { name: "홍염", color: "&c", material: RED_WOOL, odds: 1.7 }
  - { name: "청해", color: "&b", material: LIGHT_BLUE_WOOL, odds: 2.0 }
